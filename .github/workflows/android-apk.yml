name: Atlas (Android e Windows)

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: apk-${{ github.ref }}
  cancel-in-progress: true

jobs:
  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21
          cache: gradle

      # O runner ubuntu-latest já traz o Android SDK (ANDROID_HOME); o Gradle baixa o que faltar.
      - name: Instalar dependências
        run: npm ci

      - name: Copiar o protótipo para o app
        run: npm run sync

      - name: Guardar a voz neural entre builds
        uses: actions/cache@v4
        with:
          path: |
            android/app/libs/sherpa-onnx.aar
            android/app/src/main/assets/piper
            android/app/src/main/assets/kws
          key: voz-${{ hashFiles('scripts/preparar-voz.sh') }}

      - name: Baixar a voz neural (Piper / sherpa-onnx)
        run: bash scripts/preparar-voz.sh

      - name: Compilar APK
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon --stacktrace
          cp app/build/outputs/apk/debug/app-debug.apk ../Atlas.apk

      - name: Guardar APK no build
        uses: actions/upload-artifact@v5
        with:
          name: Atlas-apk
          path: Atlas.apk

  windows:
    runs-on: windows-latest
    defaults:
      run:
        working-directory: desktop
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: desktop/package-lock.json

      - name: Instalar dependências
        run: npm ci

      - name: Guardar a voz neural entre builds
        uses: actions/cache@v4
        with:
          path: desktop/recursos
          key: voz-desktop-${{ hashFiles('desktop/scripts/preparar.mjs', 'scripts/preparar-voz.sh') }}

      # copia o index.html (a mesma interface do APK) e baixa a voz Faber e o modelo da palavra "Atlas"
      - name: Preparar a interface e a voz
        run: node scripts/preparar.mjs

      - name: Gerar o instalador (Atlas-Setup.exe)
        run: npx electron-builder --win nsis --x64 --publish never "-c.extraMetadata.version=0.1.${{ github.run_number }}"

      - name: Guardar o instalador no build
        uses: actions/upload-artifact@v5
        with:
          name: Atlas-windows
          path: |
            desktop/dist/Atlas-Setup.exe
            desktop/dist/Atlas-Setup.exe.blockmap
            desktop/dist/latest.yml

  publicar:
    needs: [android, windows]
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v5
        with:
          path: saida
          merge-multiple: true

      - name: Publicar no GitHub Releases
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v0.1.${{ github.run_number }}
          name: Atlas 0.1.${{ github.run_number }} (teste)
          make_latest: true
          files: |
            saida/Atlas.apk
            saida/Atlas-Setup.exe
            saida/Atlas-Setup.exe.blockmap
            saida/latest.yml
          body: |
            Versão de teste do Atlas, gerada automaticamente a partir do commit ${{ github.sha }}.

            **Celular (Android):** baixe o `Atlas.apk` abaixo no celular, abra o arquivo e permita "instalar apps desconhecidos" quando o Android pedir. As próximas versões instalam por cima, sem precisar desinstalar.
            Link fixo: https://github.com/${{ github.repository }}/releases/latest/download/Atlas.apk

            **Computador (Windows 10 ou 11):** baixe o `Atlas-Setup.exe` e abra. Se aparecer "O Windows protegeu o computador", clique em **Mais informações › Executar assim mesmo** (o instalador ainda não tem assinatura digital paga). Depois de instalado, o Atlas se atualiza sozinho.
            Link fixo: https://github.com/${{ github.repository }}/releases/latest/download/Atlas-Setup.exe
