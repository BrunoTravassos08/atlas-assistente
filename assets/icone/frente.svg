<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 108 108">
  <defs>
    <linearGradient id="a" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset=".35" stop-color="#bff3ff"/>
      <stop offset=".7" stop-color="#43d9ff"/>
      <stop offset="1" stop-color="#2f6bff"/>
    </linearGradient>
    <linearGradient id="edge" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#43d9ff"/><stop offset="1" stop-color="#9a6bff"/>
    </linearGradient>
    <radialGradient id="halo" cx="50%" cy="55%" r="50%">
      <stop offset="0" stop-color="#43d9ff" stop-opacity=".45"/>
      <stop offset="1" stop-color="#43d9ff" stop-opacity="0"/>
    </radialGradient>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="1.4" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
    <filter id="soft" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="2.6"/></filter>
  </defs>
  <circle cx="54" cy="56" r="30" fill="url(#halo)"/>
  <!-- anel HUD -->
  <g fill="none" stroke-linecap="round">
    <circle cx="54" cy="54" r="31" stroke="#43d9ff" stroke-opacity=".55" stroke-width="1" stroke-dasharray="2 3"/>
    <path d="M27 40 A31 31 0 0 1 45 24.3" stroke="url(#edge)" stroke-width="2.2" filter="url(#glow)"/>
    <path d="M81 68 A31 31 0 0 1 63 83.7" stroke="url(#edge)" stroke-width="2.2" filter="url(#glow)"/>
  </g>
  <g transform="translate(54 55) scale(.88) translate(-54 -54)">
  <!-- A: brilho atrás -->
  <path d="M54 26 L76 80 L66 80 L54 48 L42 80 L32 80 Z" fill="#43d9ff" opacity=".7" filter="url(#soft)"/>
  <!-- A sólido, geométrico -->
  <path d="M54 26 L76 80 L66 80 L54 48 L42 80 L32 80 Z" fill="url(#a)"/>
  <path d="M54 26 L76 80 L66 80 L54 48 L42 80 L32 80 Z" fill="none" stroke="#e6f9ff" stroke-width=".6" stroke-opacity=".8"/>
  <!-- barra do A como feixe de energia -->
  <rect x="41" y="62.6" width="26" height="3.2" rx="1.6" fill="#ffffff" filter="url(#glow)"/>
  <circle cx="54" cy="64.2" r="3" fill="#ffffff" filter="url(#glow)"/>
  <!-- ponto de luz no topo -->
  <circle cx="54" cy="27.5" r="2.2" fill="#ffffff" filter="url(#glow)"/>
  </g>
</svg>
